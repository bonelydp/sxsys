services:
  mysql:
    image: mysql:8.0
    container_name: shouyi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1 FROM `user` LIMIT 1' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: shouyi-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_BIO_TOOLS: ${INSTALL_BIO_TOOLS:-false}
        INSTALL_TREE_RENDERING_DEPS: ${INSTALL_TREE_RENDERING_DEPS:-true}
    container_name: shouyi_backend
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_UPLOAD_DIR: /app/files
      APP_FILE_URL_PREFIX: /api/files/
      APP_EXCEL_TEMPLATE_PATH: /app/templates/sampledata.xlsx
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      APP_TREE_SCRIPT_PATH: ${APP_TREE_SCRIPT_PATH:-/app/scripts/visualize_tree.py}
      APP_PYTHON_EXECUTABLE: ${APP_PYTHON_EXECUTABLE:-python3}
      APP_PYTHON_WORK_DIR: ${APP_PYTHON_WORK_DIR:-}
      BIO_BLAST_PATH: ${BIO_BLAST_PATH}
      BIO_MAFFT_PATH: ${BIO_MAFFT_PATH}
      BIO_IQTREE_PATH: ${BIO_IQTREE_PATH}
      BIO_JOB_DIR: ${BIO_JOB_DIR}
      BIO_18S_DATABASE: ${BIO_18S_DATABASE}
      BIO_GP60_DATABASE: ${BIO_GP60_DATABASE}
      BIO_18S_REFERENCE: ${BIO_18S_REFERENCE}
      BIO_GP60_REFERENCE: ${BIO_GP60_REFERENCE}
    volumes:
      - ./data/files:/app/files:Z
      - ./data/bio_jobs:/app/bio-jobs:Z
      - ./bio_data:/app/bio-data:ro,Z
      - ./frontend/public/resources/sampledata.xlsx:/app/templates/sampledata.xlsx:ro,Z
      - ./scripts:/app/scripts:ro,Z
    depends_on:
      mysql:
        condition: service_healthy

  bio-db-init:
    profiles: ["tools"]
    image: shouyi-backend:local
    entrypoint: ["/bin/bash", "/app/scripts/build_blast_databases.sh"]
    volumes:
      - ./bio_data:/app/bio-data:Z
      - ./scripts:/app/scripts:ro,Z

  frontend:
    build:
      context: ./frontend
    container_name: shouyi_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:

server.port=8086

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.tomcat.native.enabled=false
swagger.enabled=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shouyi}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:shouyi}
spring.datasource.password=${MYSQL_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath*:com/example/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.example.pojo

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

logging.level.com.example.syxm.mapper=DEBUG
logging.level.org.mybatis.spring=DEBUG

app.upload-dir=${APP_UPLOAD_DIR:/app/files}
app.file-url-prefix=${APP_FILE_URL_PREFIX:/api/files/}
app.excel-template-path=${APP_EXCEL_TEMPLATE_PATH:/app/templates/sampledata.xlsx}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}

app.python.executable=${APP_PYTHON_EXECUTABLE:python3}
app.python.tree-script-path=${APP_TREE_SCRIPT_PATH:/app/scripts/visualize_tree.py}
app.python.work-dir=${APP_PYTHON_WORK_DIR:/app/scripts}

bio.blast-path=${BIO_BLAST_PATH:/usr/local/bin/blastn}
bio.mafft-path=${BIO_MAFFT_PATH:/usr/bin/mafft}
bio.iqtree-path=${BIO_IQTREE_PATH:/usr/local/bin/iqtree3}
bio.job-dir=${BIO_JOB_DIR:/app/bio-jobs}
bio.database.18s=${BIO_18S_DATABASE:/app/bio-data/blast_db/cryptosporidium-18s}
bio.database.gp60=${BIO_GP60_DATABASE:/app/bio-data/blast_db/cryptosporidium-gp60}
bio.reference.18s=${BIO_18S_REFERENCE:/app/bio-data/references/cryptosporidium-18s-reference.fasta}
bio.reference.gp60=${BIO_GP60_REFERENCE:/app/bio-data/references/cryptosporidium-gp60-reference.fasta}
